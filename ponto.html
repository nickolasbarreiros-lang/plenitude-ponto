<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ff6500">
  <title>Registrar ponto | Plenitude</title>
  <link rel="stylesheet" href="assets/css/estilos.css">
</head>
<body>
<main class="clock-page">
  <section class="clock-card premium-clock-card">
    <button id="fullscreen-toggle" class="clock-kiosk" type="button">⛶ Tela cheia</button><button id="sair" class="clock-logout" type="button">Sair</button>
    <img class="logo clock-logo" src="assets/img/logo-plenitude.png" alt="Plenitude">
    <p class="eyebrow">REGISTRO DE JORNADA</p><div id="success-banner" class="success-banner" hidden><span>✓</span><strong>Ponto registrado com sucesso</strong></div>
    <p id="clock-date" class="clock-date"></p>
    <div id="clock-time" class="clock-time">00:00:00</div>

    <div class="employee-box clock-employee-box">
      <div id="clock-avatar" class="clock-avatar"><span>P</span></div>
      <div class="clock-employee-data"><small>Funcionário</small><strong id="clock-employee">Funcionário da loja</strong><em id="clock-status">Ativo</em></div>
      <select id="ponto-funcionario-select" class="employee-select" hidden aria-label="Selecionar funcionário"></select>
    </div>

    <button id="registrar" class="punch-button"><span>◷</span> Registrar ponto</button>
    <p id="proxima" class="next-mark"></p>

    <div class="punch-steps" id="punch-steps"></div>
    <div class="punch-progress" id="punch-progress"></div>
    <div id="lista-pontos" class="punch-list punch-list-premium"></div>


    <section id="employee-self-service" class="employee-self-service" hidden>
      <div class="self-balance-grid">
        <article><span>Saldo de hoje</span><strong id="self-today-balance">—</strong></article>
        <article><span>Saldo da semana</span><strong id="self-week-balance">00:00</strong></article>
        <article><span>Saldo do mês</span><strong id="self-month-balance">00:00</strong></article>
      </div>
      <div class="self-profile-card">
        <div><small>MEU PERFIL</small><strong id="self-profile-name">—</strong><span id="self-profile-role">—</span></div>
        <div><small>MATRÍCULA / CÓDIGO</small><strong id="self-profile-code">—</strong></div>
      </div>
    </section>

    <section id="change-pin-panel" class="change-pin-panel" hidden><h3>Alterar meu PIN</h3><div class="pin-change-grid"><input id="pin-atual" type="password" inputmode="numeric" maxlength="4" placeholder="PIN atual"><input id="pin-novo" type="password" inputmode="numeric" maxlength="4" placeholder="Novo PIN"><input id="pin-confirmar" type="password" inputmode="numeric" maxlength="4" placeholder="Confirmar novo PIN"><button id="alterar-meu-pin" class="btn secondary" type="button">Salvar novo PIN</button></div></section><button id="abrir-troca-pin" class="link-button change-pin-link" type="button">Alterar meu PIN</button><p class="clock-footnote">O horário oficial é gerado e gravado pelo servidor do Supabase.</p>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-config.js"></script><script src="assets/js/auth.js"></script>
  <script src="assets/js/database.js"></script><script src="assets/js/app.js"></script>
<script src="assets/js/ponto-pin.js"></script>
</body>
</html>
