<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ff6500">
  <title>Registrar ponto | Plenitude</title>
  <link rel="stylesheet" href="assets/css/estilos.css">
</head>
<body>
<main class="clock-page">
  <section class="clock-card premium-clock-card">
    <a class="back-link" href="admin.html">← Voltar ao painel</a>
    <img class="logo clock-logo" src="assets/img/logo-plenitude.png" alt="Plenitude">
    <p class="eyebrow">REGISTRO DE JORNADA</p>
    <p id="clock-date" class="clock-date"></p>
    <div id="clock-time" class="clock-time">00:00:00</div>

    <div class="employee-box clock-employee-box">
      <div id="clock-avatar" class="clock-avatar"><span>P</span></div>
      <div class="clock-employee-data"><small>Funcionário</small><strong id="clock-employee">Funcionário da loja</strong><em id="clock-status">Ativo</em></div>
      <select id="ponto-funcionario-select" class="employee-select" hidden aria-label="Selecionar funcionário"></select>
    </div>

    <button id="registrar" class="punch-button"><span>◷</span> Registrar ponto</button>
    <p id="proxima" class="next-mark"></p>

    <div class="punch-steps" id="punch-steps"></div>
    <div class="punch-progress" id="punch-progress"></div>
    <div id="lista-pontos" class="punch-list punch-list-premium"></div>

    <p class="clock-footnote">O horário oficial é gerado e gravado pelo servidor do Supabase.</p>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-config.js"></script><script src="assets/js/auth.js"></script>
  <script src="assets/js/database.js"></script><script src="assets/js/app.js"></script>
<script>initPonto()</script>
</body>
</html>
