<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ff6500">
  <title>Plenitude Ponto</title>
  <link rel="stylesheet" href="assets/css/estilos.css">
</head>
<body class="login-body">
  <main class="login-shell">
    <section class="login-card" aria-labelledby="titulo-login">
      <div class="brand-box">
        <img class="logo" src="assets/img/logo-plenitude.png" alt="Presentes Plenitude e Artigos Religiosos">
      </div>
      <p class="eyebrow">SISTEMA INTERNO</p>
      <h1 id="titulo-login">Controle de Ponto</h1>
      <p class="muted">Acesse o painel para administrar o funcionário, a jornada e as marcações.</p>

      <form id="login-form" class="login-form">
        <label for="email">E-mail</label>
        <div class="input-wrap"><span>✉</span><input id="email" type="email" placeholder="seuemail@exemplo.com" autocomplete="username" required></div>
        <label for="senha">Senha</label>
        <div class="input-wrap"><span>●</span><input id="senha" type="password" placeholder="Digite sua senha" autocomplete="current-password" required><button id="mostrar-senha" class="eye-btn" type="button" aria-label="Mostrar senha">Mostrar</button></div>
        <button type="submit" class="btn primary login-btn">Entrar no sistema</button>
        <p id="login-feedback" class="login-feedback" role="status" aria-live="polite"></p>
      </form>

      <div class="demo-box cloud-box"><strong>Login protegido</strong><span>A autenticação é realizada pelo Supabase.</span></div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/login.js"></script>
</body>
</html>
